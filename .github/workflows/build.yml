name: Build

# Changes that only touch documentation don't trigger a build.
# (Path filters don't apply to tag pushes, so releases always build.)
on:
  push:
    branches: [main]
    tags: ['v*']   # pushing a tag like v0.2.0 also publishes a GitHub Release
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'branding/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'branding/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (tests + release APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The keystore lives in repository secrets (base64). Without them (e.g. pull requests
      # from forks) the release APK is built unsigned.
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ORG_GRADLE_PROJECT_releaseStoreFile=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: the release APK will be unsigned."
          fi

      - name: Shared tests and release APK
        env:
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew allTests :androidApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: bottle-checker-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: shared/build/reports/tests/

  ios:
    name: iOS (simulator tests + unsigned build)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      # Builds the Kotlin framework (via the Xcode build phase) and the Swift code for a real
      # device, without code signing. The result can't be installed as-is; it needs re-signing
      # (e.g. Sideloadly/AltStore with a free Apple ID) or a paid account's signing setup.
      - name: Build iOS app (unsigned)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          APP=$(find iosApp/build/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qr ../bottle-checker-unsigned.ipa Payload)

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v7
        with:
          name: bottle-checker-unsigned-ipa
          path: bottle-checker-unsigned.ipa
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: shared/build/reports/tests/

  # Runs only for version tags: attaches the signed APK and the unsigned .ipa to a GitHub Release.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp dist/bottle-checker-release-apk/*.apk "bottle-checker-$TAG.apk"
          cp dist/bottle-checker-unsigned-ipa/*.ipa "bottle-checker-$TAG-ios-unsigned.ipa"
          cat > notes.md <<'NOTES'
          **Android:** download the `.apk` and open it on the phone (allow "Install unknown apps" when asked).
          Signed with the project's release key, so newer versions install over older ones.

          **iOS:** the `.ipa` is unsigned. It only installs after re-signing (e.g. Sideloadly or AltStore
          with an Apple ID); otherwise build from Xcode, see the README. Not yet tested on an iPhone/iPad.

          Not affiliated with BCRS Malta.
          NOTES
          gh release create "$TAG" \
            "bottle-checker-$TAG.apk" \
            "bottle-checker-$TAG-ios-unsigned.ipa" \
            --title "Bottle Checker $TAG" \
            --notes-file notes.md \
            --generate-notes
