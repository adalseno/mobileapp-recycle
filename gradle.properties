kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# --- Branding (Android). iOS equivalents live in iosApp/Configuration/Config.xcconfig ---
# The in-app title is the `app_name` string in shared/src/commonMain/composeResources/values/strings.xml
app.name=Bottle Checker
app.applicationId=io.github.adalseno.bottlechecker
app.versionCode=1
app.versionName=0.1.0

# iOS tasks can't run on Linux; skip them quietly.
kotlin.native.ignoreDisabledTargets=true
